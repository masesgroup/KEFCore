name: Update performance documentation

# Separate from build.yaml's existing weekly full-matrix run (Saturday 04:00 UTC, which already
# extends to more OSes/JDKs and produces its own test-results-combined-report/kefcore-test-baseline-data
# artifacts) so that refreshing the human-facing performance docs (README.md, documentation index,
# the benchmarks article) doesn't require - and doesn't duplicate the cost of - that full sweep.
# Runs the default (lightweight) Linux-only matrix from build_common.yaml instead.
#
# On-demand via workflow_dispatch, and on a weekly schedule so a fresh baseline is reliably
# available for aggregate_test_results' "Find the latest successful performance-docs.yaml run on
# master" lookup (build_common.yaml) - without a regular cadence, that lookup would rarely find
# anything and every comparison would fall back to "no baseline". Wednesday 04:00 UTC, offset from
# build.yaml's existing Saturday 04:00 UTC schedule so the two don't compete for the same runners.
on:
  workflow_dispatch:
    inputs:
      EnableIntermediateOutput:
        description: 'Writes more info in output of tests'
        required: false
        default: false
        type: boolean
      UseSpecialSettings:
        description: 'Use special settings: not available in forks'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 3"

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  run_tests:
    permissions:
      contents: read
      pull-requests: write
      attestations: write
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/build_common.yaml
    with:
      EnableIntermediateOutput: ${{ inputs.EnableIntermediateOutput || false }}
      EnableLinuxTests: true
      UseSpecialSettings: ${{ inputs.UseSpecialSettings || false }}
      # Everything else left at build_common.yaml's defaults (false): single OS/JDK-vendor/LTS-version,
      # no Windows/macOS - the lightweight matrix, sufficient for a performance-docs snapshot.
    secrets:
      actor: ${{ github.actor }}
      GITHUB_TOKEN_INHERITED: ${{ secrets.GITHUB_TOKEN }}
      JCOBRIDGE_ENCODED: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
      FIRST_SPECIAL_SETTINGS_PASSWORD: ${{ secrets.FIRST_SPECIAL_SETTINGS_PASSWORD }}
      SPECIAL_SETTINGS_PASSWORD: ${{ secrets.SPECIAL_SETTINGS_PASSWORD }}
      
  update_docs:
    needs: run_tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'

      - name: Download all structured test-result artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-results_*
          path: ${{ github.workspace }}/all-test-results
          merge-multiple: true

      - name: Generate performance documentation
        id: generate
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(${{ github.workspace }}/all-test-results/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No structured test-result files found - skipping documentation update."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            python3 ${{ github.workspace }}/test/analyze-test-results/generate_perf_docs.py \
              --input "${files[@]}" \
              --readme ${{ github.workspace }}/README.md \
              --doc-index ${{ github.workspace }}/src/documentation/index.md \
              --article ${{ github.workspace }}/src/documentation/articles/benchmarks.md \
              --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            if [ -z "$(git -C ${{ github.workspace }} status --porcelain)" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi
        shell: bash

      - name: Remove all structured test-result artifacts       
        run: rm -rf ${{ github.workspace }}/all-test-results/*

      - name: Open a pull request with the updated documentation
        if: steps.generate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update performance benchmarks"
          # Unique per run (rather than a fixed branch name) so this never collides with a still-open
          # PR from a previous run - the fixed name forced every later run to either reuse/force-push
          # that branch (silently replacing an unreviewed PR's diff) or fail outright if branch
          # protection/permissions didn't allow the push.
          branch: docs/update-performance-benchmarks-${{ github.run_id }}
          delete-branch: true
          title: "docs: update performance benchmarks (run ${{ github.run_id }})"
          body: |
            Automated update of the performance documentation (README.md, documentation index,
            [benchmarks article](src/documentation/articles/benchmarks.md)) from the latest
            [performance-docs run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Generated by `test/analyze-test-results/generate_perf_docs.py` — review the diff before merging,
            same as any other change.
          labels: documentation, automated